name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vrt
          POSTGRES_PASSWORD: vrt
          POSTGRES_DB: vrt_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            apps/backend -> target
            apps/backend/migration -> target

      # Debug builds on purpose: TEST_LOGIN_ENABLED (how the specs get a
      # session — there is no password login) is refused by release builds.
      - name: Build backend
        run: cargo build --bin backend
        working-directory: apps/backend

      - name: Build migration CLI
        run: cargo build --bin migration
        working-directory: apps/backend/migration

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/frontend/package.json

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
        working-directory: apps/frontend

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-e2e-${{ runner.os }}-${{ hashFiles('apps/frontend/pnpm-lock.yaml', 'e2e/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-e2e-${{ runner.os }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      # e2e has its own pnpm root (e2e/pnpm-workspace.yaml) so a browser
      # download never rides along with the repo-root install.
      - name: Install e2e dependencies
        run: pnpm install --frozen-lockfile
        working-directory: e2e

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: pnpm test
        working-directory: e2e
        env:
          CI: 'true'
          BACKEND_BIN: ${{ github.workspace }}/apps/backend/target/debug/backend
          MIGRATION_BIN: ${{ github.workspace }}/apps/backend/migration/target/debug/migration
          E2E_DATABASE_URL: postgresql://vrt:vrt@localhost:5432/vrt_e2e
          E2E_REDIS_URL: redis://localhost:6379

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
