# Detects drift between the backend OpenAPI export and the committed
# apps/frontend/openapi.json. That file is the frontend's only contract source
# (the generated api.d.ts is gitignored), so a stale copy silently ships wrong
# types.
name: OpenAPI Drift Check

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/openapi.json'
      - 'rust-toolchain.toml'
      - '.github/workflows/openapi-drift-check.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/openapi.json'
      - 'rust-toolchain.toml'
      - '.github/workflows/openapi-drift-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install mold and jq
        run: sudo apt-get update && sudo apt-get install -y mold jq

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/backend -> target

      - name: Export OpenAPI from backend
        run: cargo run --bin export_openapi -- /tmp/exported-openapi.json
        working-directory: apps/backend

      - name: Compare with committed openapi.json
        run: |
          set -euo pipefail
          jq -S '.' apps/frontend/openapi.json > /tmp/committed-openapi.json
          jq -S '.' /tmp/exported-openapi.json > /tmp/exported-openapi-normalized.json

          if diff -q /tmp/committed-openapi.json /tmp/exported-openapi-normalized.json >/dev/null; then
            echo "OpenAPI contract is in sync."
            exit 0
          fi

          echo "::error::apps/frontend/openapi.json is out of sync with the backend API."
          echo ""
          echo "After changing the backend API, regenerate and commit openapi.json:"
          echo "  cd apps/frontend && pnpm openapi"
          echo "  git add apps/frontend/openapi.json"
          echo ""
          echo "Diff (normalized):"
          diff -u /tmp/committed-openapi.json /tmp/exported-openapi-normalized.json | head -200 || true
          exit 1
